[XSpeed]

; XSpeed while accelerating on the ground
; Hex: 0x0020
acceleratingInt = 0
acceleratingFraction = 32

; XSpeed while accelerating during a jump
; Hex: 0x0150
jumpAcceleratingInt = 1
jumpAcceleratingFraction = 80

; XSpeed while running
; Hex: 0x0160
runningInt = 1
runningFraction = 96

; XSpeed while decelerating on the ground
; Hex: 0x0080
deceleratingInt = 0
deceleratingFraction = 128

; XSpeed during jumping after acceleration
; Hex: 0x0150
jumpingInt = 1
jumpingFraction = 80

; XSpeed while reeling from taking damage
; Hex: 0x0090
reelingInt = 0
reelingFraction = 144


[YSpeed]

; YSpeed at the start of a jump
; Hex: 0x04DF
jumpingInt = 4
jumpingFraction = 223

; YSpeed at the start of a fall
; Hex: -0x00C0
fallingInt = -0
fallingFraction = -64

; YSpeed of gravity
; Hex: 0x0040
gravityInt = 0
gravityFraction = 64

; YSpeed that is set when the A/jump button is released
; while still rising faster than a set treshold
; Hex: 0x0100
jumpReleasedInt = 1
jumpReleasedFraction = 0

; if YSpeed is higher than this when
; releasing the A/jump button, it's capped
; Hex: 0x021F
jumpReleasedMaxInt = 2
jumpReleasedMaxFraction = 31

; minimum YSpeed (can't fall faster than this)
; Hex: -0x0C00
minInt = -12
minFraction = -0

; YSpeed while climbing
; Hex: 0x00C0
climbingInt = 0
climbingFraction = 192

; YSpeed that is set when colliding
; Hex: -0x0040
collisionInt = -0
collisionFraction = -64

; YSpeed while scrolling
; Hex: 0x0040
scrollingInt = 0
scrollingFraction = 64

; YSpeed at first scrolling frame
; Hex: 0x0000
scrollingFirstFrameInt = 0
scrollingFirstFrameFraction = 0

; YSpeed while reeling from taking damage
; Hex: 0x0140
reelingInt = 1
reelingFraction = 64


[Options]
; flags that enable/disable certain quirks

; After scrolling, adjust the Y coordinate to defined values.
adjustPositionAfterScroll = true

; When scrolling starts, the fractional part of the YSpeed is set to 0.
resetFractionAtScrollStart = true

; When scrolling starts, the fractional part of the YSpeed
; is set to startFraction from the ScrollConstants category.
setFractionAtScrollStart = true


[Durations]
; state-specific durations

accelerating = 7
acceleratingPreviousAnimation = 0
afterScrolling = 33
beforeScrolling = 33
decelerating = 8
deceleratingPreviousAnimation = 0
invincible = 83
landing = 2
ready = 184
reeling = 27
scrolling = 60
shooting = 15


[ScrollConstants]

startPosTop = 4
startPosBottom = 232
startFraction = 248
downEndPosY = 7
upEndPosY = 229
verticalSpeed = 4


[BoundingBox]

width = 15
height = 23
heightHalf = 12

; offset from x coordinate to get bounding box's x position
xOffset = -8

; offset from y coordinate to get bounding box's y position
yOffset = -12


[Bullet]

spritesheet = bullet.bmp

; offset from x coordinate to get bullet's starting x position...
; ...when shooting right
xOffsetRight = 16
; ...when shooting left
xOffsetLeft = -24

; offset from y coordinate to get bullet's starting y position
yOffset = -3


[ReadyMessage]

displayInterval = 8
