[XSpeed]

; XSpeed while accelerating on the ground
; Hex: 0x0000
acceleratingInt = 0
acceleratingFraction = 0

; XSpeed while accelerating during a jump
; Hex: 0x014C
jumpAcceleratingInt = 1
jumpAcceleratingFraction = 76

; XSpeed while running
; Hex: 0x014C
runningInt = 1
runningFraction = 76

; XSpeed while decelerating on the ground
; Hex: 0x0000
deceleratingInt = 0
deceleratingFraction = 0

; XSpeed during jumping after acceleration
; Hex: 0x014C
jumpingInt = 1
jumpingFraction = 76

; XSpeed while reeling from taking damage
; Hex: 0x0080
; (NEW (?): 0x0040 while holding direction)
reelingInt = 0
reelingFraction = 128


[YSpeed]

; YSpeed at the start of a jump
; Hex: 0x04F4
jumpingInt = 4
jumpingFraction = 244

; YSpeed at the start of a fall
; Hex: -0x0080
; (running animation for 3 frames before falling)
fallingInt = -0
fallingFraction = -128

; YSpeed of gravity
; Hex: 0x0040
gravityInt = 0
gravityFraction = 64

; YSpeed that is set when the A/jump button is released
; while still rising faster than a set treshold
; Hex: 0x0000
jumpReleasedInt = 0
jumpReleasedFraction = 0

; if YSpeed is higher than this when
; releasing the A/jump button, it's capped
; Hex: 0x0000
jumpReleasedMaxInt = 0
jumpReleasedMaxFraction = 0

; minimum YSpeed (can't fall faster than this)
; Hex: -0x0700
minInt = -7
minFraction = -0

; YSpeed while climbing
; Hex: 0x014C
climbingInt = 1
climbingFraction = 76

; YSpeed that is set when colliding
; Hex: -0x0000
collisionInt = -0
collisionFraction = -0

; YSpeed while scrolling
; Hex: 0x0040
scrollingInt = 0
scrollingFraction = 64

; YSpeed at first scrolling frame
; Used with option firstScrollingFrameIsDifferentSpeed
; Hex: 0x0100
scrollingFirstFrameInt = 1
scrollingFirstFrameFraction = 0

; YSpeed while reeling from taking damage
; Hex: 0x0000
reelingInt = 0
reelingFraction = 0


[Options]
; flags that enable/disable certain quirks

; After scrolling, adjust the Y coordinate to defined values.
adjustPositionAfterScroll = false

; When pressing down when near a ladder but not standing on top of it,
; allow Rockman to grab it.
allowLadderDownGrabBelowTop = true

; Apply gravity before checking for collisions.
applyGravityBeforeCollisionCheck = true

; Climb one frame worth of distance up when grabbing a ladder jumping.
climbAfterJumpingGrab = true

; The first frame of the acceleration state has the walking state's XSpeed.
firstAcceleratingFrameIsWalkingSpeed = true

; The first frame of the deceleration state has the walking state's XSpeed.
firstDeceleratingFrameIsWalkingSpeed = false

; The first frame of the scrolling state uses scrollingFirstFrame
; from the YSpeed category as its YSpeed.
firstScrollingFrameIsDifferentSpeed = true

; If jumping up to grab a ladder enclosed by solid tiles but colliding
; with aforementioned tiles instead, only help Rockman grab it if the
; the collision point is one pixel next to the ladder.
limitedEnclosedLadderGrabAssist = true

; Do not apply gravity after an immediate jump (noJumpDelay = true).
; (it's as if gravity is applied before updating Y)
noGravityApplicationAfterJump = true

; No delay of one frame before jumping.
noJumpDelay = true

; If jumping up to grab a ladder enclosed by solid tiles but colliding
; with aforementioned tiles instead, do not position Rockman right below
; the ladder, which would allow him to grab on.
noLadderGrabAssistAfterCollision = true

; When falling faster than the minimum YSpeed, only adjust the integer
; part of the Y coordinate. Do not reset the fractional part.
onlyIntAdjustmentAtBelowYSpeedMin = true

; When releasing the jump button while still rising faster than a set
; treshold, only adjust the integer part of the Y coordinate.
; Do not reset the fractional part.
onlyIntAdjustmentAtJumpReleased = true

; At collision, only adjust the integer part of the Y coordinate.
; Do not reset the fractional part.
onlyIntAdjustmentAtYCollision = true

; When scrolling starts, the fractional part of the YSpeed is set to 0.
resetFractionAtScrollStart = false

; When scrolling starts, the fractional part of the YSpeed
; is set to startFraction from the ScrollConstants category.
setFractionAtScrollStart = false

; At collision, set the integer part of the YSpeed to zero, and make
; the fractional part negative. Also, apply gravity.
specialUpwardsYCollisionTreatment = true

; Use the alternative method to check if a ladder can be grabbed.
useAlternativeLadderGrabCheck = true

; Use bounding box relative coordinate offsets to check for ladders.
useBoundingBoxOffsetForLadderCheck = true


